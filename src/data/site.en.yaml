about:
  eyebrow: "About"
  title: "From quality engineering to AI engineering"
  paragraphs:
    - "I started in IT and network administration, including in the Polish Army, then spent more than ten years in UK logistics leading teams of up to 36 people."
    - "Today I am a Quality Lead Engineer at Leidos in aviation security systems — ISO 9001 audits, CAPA, supplier quality and a team of engineers and inspectors."
    - "Since 2024 I run Zatto Software, where I build products with a team of AI agents. Quality thinking is what makes that team reliable."
  location: "UK now · Warsaw area from 2027"
