hero:
  name: "Mariusz Łaszewski"
  tagline: "Quality lead who builds AI agent teams."
  intro: "I design multi-agent LLM systems and run them like an engineering team: clear roles, quality gates, measured cost and no secrets in code. My background in quality engineering is why the agents ship work I can trust."
  links:
    - { label: "GitHub", href: "https://github.com/laszewskimariusz" }
    - { label: "LinkedIn", href: "https://www.linkedin.com/in/mariusz-laszewski-32028394/" }
    - { label: "Email", href: "mailto:laszewskimariusz@gmail.com" }
services:
  eyebrow: "What I do"
  title: "Three things I am good at"
  items:
    - title: "Agentic systems"
      body: "Teams of specialised agents with explicit roles, hand-offs and limits — orchestrated, not improvised."
      points: ["multi-agent orchestration", "context engineering", "long-term agent memory", "model routing by task"]
    - title: "MCP & integrations"
      body: "Agents get tools through the Model Context Protocol and packaged plugins, with permissions scoped per role."
      points: ["custom MCP servers", "versioned plugin with agents and skills", "integrations with issue tracking and deployment"]
    - title: "Quality & safety for AI"
      body: "The same discipline as in a regulated QMS: specs, reviews, tests, documented decisions and guarded secrets."
      points: ["spec review gate (3 reviewers, 8/10)", "LLM-as-judge and E2E tests", "prompt-injection and secret-leak guards", "secrets in HashiCorp Vault"]
team:
  eyebrow: "How we work"
  title: "One human, one coordinator, a team of specialists"
  intro: "I set direction and approve what matters. A coordinating agent plans and delegates. Specialist agents do the work — each with its own role, tools and model."
  human: { role: "Me — CEO & product owner", does: "Sets goals, makes business decisions, approves specs and irreversible actions." }
  coordinator: { role: "Coordinator agent (CTO)", does: "Breaks work into tasks, picks the right specialist and model, checks results before they reach me." }
  agents:
    - { id: architect, role: "Architect", does: "System and API design, architecture decision records.", model: strong }
    - { id: developer, role: "Developer", does: "Features and fixes, test-first, clean code.", model: strong }
    - { id: reviewer, role: "Code reviewer", does: "Reviews every change for correctness and standards.", model: strong }
    - { id: qa, role: "QA engineer", does: "Unit, integration and end-to-end tests, test plans.", model: light }
    - { id: security, role: "Security", does: "OWASP checks, hardening, secret scanning.", model: strong }
    - { id: infra, role: "Infrastructure", does: "Containers, CI/CD, monitoring, deployments.", model: light }
    - { id: research, role: "Research", does: "Technology research, benchmarks, recommendations.", model: light }
    - { id: auditor, role: "ISO auditor", does: "ISO 9001 and ISO 27001 audits of the products we build.", model: strong }
  flowTitle: "From idea to production"
  flow:
    - { id: task, label: "Task", detail: "Every piece of work starts as a tracked issue." }
    - { id: spec, label: "Spec", detail: "A written spec with acceptance criteria." }
    - { id: gate, label: "Review gate", detail: "Three independent reviewers; below 8/10 it goes back." }
    - { id: build, label: "Build", detail: "Implementation on an isolated build machine, test-first." }
    - { id: review, label: "Code review", detail: "A separate agent reviews the change." }
    - { id: test, label: "Tests", detail: "Automated tests, E2E where it matters." }
    - { id: ship, label: "Ship", detail: "Deploy, verify, record the decision." }
  principlesTitle: "Rules the team follows"
  principles:
    - "Cheap models read and search; strong models decide."
    - "One writer per file — agents never edit the same thing in parallel."
    - "Zero secrets in repositories; everything comes from a vault at runtime."
    - "Irreversible actions need a human yes."
    - "Verify what an agent concluded, not only what it read."
