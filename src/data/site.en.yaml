    - { id: topsky, name: "TopSky Desktop", summary: "Desktop companion for flight-simulation pilots: livery manager for MSFS and X-Plane.", stack: ["Tauri", "Rust", "React"], visibility: production }
    - { id: coc, name: "Claude-of-Crafting", summary: "Path of Exile crafting simulator with an AI coach built on the Claude API.", stack: ["Next.js", "Claude API"], visibility: private }
    - { id: shygarlic, name: "Shy Garlic", summary: "Open-source homelab dashboard where the YAML file and the UI are the same thing.", stack: ["Go", "Docker", "Helm"], visibility: open-source, repo: "https://github.com/zatto-dev/shy-garlic" }
    - { id: brainai, name: "brain-ai", summary: "Token-efficient memory and multi-agent orchestration framework for coding agents.", stack: ["Claude Code", "Agent Skills", "Markdown"], visibility: open-source, repo: "https://github.com/laszewskimariusz/brain-ai" }
    - { id: atlas, name: "Milky Way Atlas", summary: "Interactive 3D atlas of the galaxy with its own WebGL2 physics engine.", stack: ["WebGL2", "Three.js", "TypeScript"], visibility: private }
    - { id: rukia, name: "Rukia", summary: "Family AI assistant with long-term memory, model fallback and hardened permissions.", stack: ["hermes-agent", "Honcho"], visibility: private }
