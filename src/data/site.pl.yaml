services:
  eyebrow: "Co robię"
  title: "Trzy rzeczy, w których jestem dobry"
  items:
    - title: "Systemy agentowe"
      body: "Zespoły wyspecjalizowanych agentów z jasnymi rolami, przekazaniami i limitami — orkiestrowane, nie improwizowane."
      points: ["orkiestracja wielu agentów", "context engineering", "pamięć długoterminowa agentów", "routing modeli według zadania"]
    - title: "MCP i integracje"
      body: "Agenci dostają narzędzia przez Model Context Protocol i wersjonowane pluginy, z uprawnieniami ograniczonymi do roli."
      points: ["własne serwery MCP", "wersjonowany plugin z agentami i skillami", "integracje z systemem zadań i wdrożeniami"]
    - title: "Jakość i bezpieczeństwo AI"
      body: "Ta sama dyscyplina co w regulowanym QMS: specyfikacje, przeglądy, testy, udokumentowane decyzje i chronione sekrety."
      points: ["bramka przeglądu specyfikacji (3 recenzentów, 8/10)", "LLM-as-judge i testy E2E", "ochrona przed prompt injection i wyciekiem sekretów", "sekrety w HashiCorp Vault"]
team:
  eyebrow: "Jak pracujemy"
  title: "Jeden człowiek, jeden koordynator, zespół specjalistów"
  intro: "Ja wyznaczam kierunek i zatwierdzam to, co ważne. Agent-koordynator planuje i deleguje. Agenci-specjaliści wykonują pracę — każdy z własną rolą, narzędziami i modelem."
  human: { role: "Ja — CEO i właściciel produktu", does: "Wyznaczam cele, podejmuję decyzje biznesowe, zatwierdzam specyfikacje i nieodwracalne działania." }
  coordinator: { role: "Agent-koordynator (CTO)", does: "Dzieli pracę na zadania, dobiera specjalistę i model, sprawdza wyniki, zanim trafią do mnie." }
  agents:
    - { id: architect, role: "Architekt", does: "Projekt systemu i API, rejestr decyzji architektonicznych.", model: strong }
    - { id: developer, role: "Developer", does: "Funkcje i poprawki, najpierw testy, czysty kod.", model: strong }
    - { id: reviewer, role: "Code reviewer", does: "Przegląda każdą zmianę pod kątem poprawności i standardów.", model: strong }
    - { id: qa, role: "Inżynier QA", does: "Testy jednostkowe, integracyjne i end-to-end, plany testów.", model: light }
    - { id: security, role: "Bezpieczeństwo", does: "Kontrole OWASP, utwardzanie, skanowanie sekretów.", model: strong }
    - { id: infra, role: "Infrastruktura", does: "Kontenery, CI/CD, monitoring, wdrożenia.", model: light }
    - { id: research, role: "Research", does: "Analiza technologii, benchmarki, rekomendacje.", model: light }
    - { id: auditor, role: "Audytor ISO", does: "Audyty ISO 9001 i ISO 27001 budowanych produktów.", model: strong }
  flowTitle: "Od pomysłu do produkcji"
  flow:
    - { id: task, label: "Zadanie", detail: "Każda praca zaczyna się od zgłoszenia w systemie zadań." }
    - { id: spec, label: "Specyfikacja", detail: "Spisana specyfikacja z kryteriami akceptacji." }
    - { id: gate, label: "Bramka przeglądu", detail: "Trzech niezależnych recenzentów; poniżej 8/10 wraca do poprawy." }
    - { id: build, label: "Budowa", detail: "Implementacja na odizolowanej maszynie, najpierw testy." }
    - { id: review, label: "Code review", detail: "Osobny agent przegląda zmianę." }
    - { id: test, label: "Testy", detail: "Testy automatyczne, E2E tam, gdzie to ważne." }
    - { id: ship, label: "Wdrożenie", detail: "Deploy, weryfikacja, zapis decyzji." }
  principlesTitle: "Zasady zespołu"
  principles:
    - "Tanie modele czytają i szukają; mocne modele decydują."
    - "Jeden pisarz na plik — agenci nie edytują tego samego równolegle."
    - "Zero sekretów w repozytoriach; wszystko pobierane z sejfu w czasie działania."
    - "Nieodwracalne działania wymagają zgody człowieka."
    - "Weryfikuj to, co agent wywnioskował, nie tylko to, co przeczytał."
