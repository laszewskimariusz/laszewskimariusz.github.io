hero:
  name: "Mariusz Łaszewski"
  tagline: "Lider jakości, który buduje zespoły agentów AI."
  intro: "Projektuję wieloagentowe systemy LLM i prowadzę je jak zespół inżynierski: jasne role, bramki jakości, mierzony koszt i zero sekretów w kodzie. Doświadczenie w inżynierii jakości sprawia, że agenci dostarczają pracę, której mogę ufać."
  links:
