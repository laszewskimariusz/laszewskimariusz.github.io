name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run links
      - run: bash tests/guard/guard.test.sh
        env: { GUARD_SKIP_GITLEAKS: "1" }
      - name: forbidden strings (tree + history)
        run: bash scripts/guard.sh
        env:
          GUARD_SKIP_GITLEAKS: "1"
          GUARD_PRIVATE_PATTERNS: ${{ secrets.GUARD_PRIVATE_PATTERNS }}
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
